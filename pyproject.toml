[project]
name = "simple-scraping-telegram-bot-automation"
version = "0.1.0"
description = "POC for: Simple Scraping + Telegram Bot Automation (MVP)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "streamlit>=1.40.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
